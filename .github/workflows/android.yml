name: Android build

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'docs/**', 'logos/**', '.github/workflows/pages.yml']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # per pubblicare la release
    env:
      KEYSTORE_B64: ${{ secrets.BADA_KEYSTORE_B64 }}
      KEYSTORE_PW: ${{ secrets.BADA_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Senza questi secret l'APK è firmato con una chiave debug casuale e non viene pubblicato:
      # gli aggiornamenti funzionano solo se ogni versione ha la stessa firma.
      - name: Chiave di firma
        if: env.KEYSTORE_B64 != ''
        run: |
          # Spazi e a capo finiti nei secret copiando dal telefono non devono rompere la firma.
          printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/bada.p12"
          PW=$(printf '%s' "$KEYSTORE_PW" | tr -d ' \t\r\n')
          echo "::add-mask::$PW"
          echo "BADA_KEYSTORE=$RUNNER_TEMP/bada.p12" >> "$GITHUB_ENV"
          echo "BADA_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/bada.p12" -storetype pkcs12 -storepass "$PW" > /dev/null \
            || { echo "::error::BADA_KEYSTORE_PASSWORD non apre BADA_KEYSTORE_B64: controlla di aver incollato la coppia giusta"; exit 1; }

      - name: Test e build
        run: gradle testDebugUnitTest assembleRelease

      - name: Nome APK
        run: cp app/build/outputs/apk/release/app-release.apk offtrack.apk

      - uses: actions/upload-artifact@v4
        with:
          name: offtrack-apk
          path: offtrack.apk

      # Ogni push (o avvio manuale) su main firmato diventa una release: l'app la trova da sola e propone l'aggiornamento.
      - name: Pubblica release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.KEYSTORE_B64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" offtrack.apk --title "Offtrack ${TAG#v}" \
            --notes "$(git log -1 --pretty=%B)" --latest
